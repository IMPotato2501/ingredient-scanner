<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f7d4f">
<title>成分查查</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --text:#1d1d1b; --sub:#6b6a66; --line:#e4e2dc;
  --g:#2f9e5b; --y:#d99a00; --r:#d64541; --u:#9a9892; --accent:#2f7d4f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151513; --card:#1f1f1c; --text:#ecebe6; --sub:#a09f99; --line:#33322e;
    --g:#4cc27d; --y:#f0b429; --r:#f0625d; --u:#7d7c77; --accent:#4cc27d; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC",sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}
.tag{color:var(--sub);font-size:13px;margin:0 0 14px}
textarea{width:100%;min-height:120px;padding:12px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--text);font-size:15px;resize:vertical}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button,.btn{flex:1;min-width:90px;padding:12px 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=file]{display:none}
.hint{font-size:13px;color:var(--sub);margin-top:10px}
.status{font-size:14px;color:var(--sub);margin:12px 0 0;min-height:1em}
.summary{display:flex;gap:6px;margin:16px 0 8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.d0{background:var(--g)}.d1{background:var(--y)}.d2{background:var(--r)}.du{background:var(--u)}
.filters{display:flex;gap:6px;margin-bottom:8px}
.filters label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
ul{list-style:none;padding:0;margin:0}
li{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--u);border-radius:10px;
  padding:10px 12px;margin-bottom:8px}
li.r0{border-left-color:var(--g)} li.r1{border-left-color:var(--y)} li.r2{border-left-color:var(--r)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.zh{font-weight:700;font-size:16px}
.type{font-size:12px;color:var(--sub);white-space:nowrap}
.en{font-size:13px;color:var(--sub)}
.note{font-size:13px;margin-top:4px}
.legend{font-size:12px;color:var(--sub);margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.legend p{margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>成分查查</h1>
  <p class="tag">英文成分表 → 中文名 + 添加剂分级</p>

  <textarea id="txt" placeholder="把成分表粘贴到这里（英文）……"></textarea>
  <div class="row">
    <button class="primary" id="go">识别</button>
    <label class="btn" for="cam">📷 拍照识别</label>
    <input type="file" id="cam" accept="image/*" capture="environment">
    <button id="clear">清空</button>
  </div>
  <div class="row">
    <button id="paste">📋 从剪贴板粘贴</button>
    <button id="demo">试一个例子</button>
  </div>
  <p class="hint">推荐用法（安卓）：相机打开 Google Lens → 对准成分表 → 选中文字 → 复制 → 回到这里粘贴。比网页拍照识别更准。</p>
  <p class="status" id="status"></p>

  <div id="out" hidden>
    <div class="summary" id="sum"></div>
    <div class="filters"><label><input type="checkbox" id="onlyAdd"> 只看添加剂和需留意的</label></div>
    <ul id="list"></ul>
  </div>

  <div class="legend">
    <p><span class="dot d0" style="display:inline-block"></span> 正常：普通食材，或一般认为安全的添加剂</p>
    <p><span class="dot d1" style="display:inline-block"></span> 留意：适量即可，或安全性有讨论、特定人群需注意</p>
    <p><span class="dot d2" style="display:inline-block"></span> 尽量少吃：有较明确的健康担忧，或在其他国家被禁/限用</p>
    <p><span class="dot du" style="display:inline-block"></span> 未识别：数据库里还没有</p>
    <p>成分表按含量从多到少排列，越靠前占比越大。分级仅供个人参考，不是医学建议。</p>
  </div>
</div>

function norm(s){
  return s.toLowerCase().replace(/&/g,' and ').replace(/[’'`´]/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
const byCode = {}, byName = {}, aliasList = [];
function addEntry(e, aliases){
  for(const a of aliases){ const k = norm(a); if(!k) continue; if(!byName[k]){ byName[k]=e; aliasList.push(k); } }
}

}

aliasList.sort((a,b)=>b.length-a.length);

// ===== 解析 =====
const LEAD = new Set(['ingredients','ingredient','contains','contain','may','traces','trace','of','and','or','also','with','from','added','other','the','less','than','including','includes','made','min','minimum']);
function stripLead(t){
  let w = t.split(' ');
  while(w.length && LEAD.has(w[0])) w.shift();
  while(w.length && (w[w.length-1]==='and'||w[w.length-1]==='or'||w[w.length-1]==='of')) w.pop();
  return w.join(' ');
}
function lev(a,b){
  const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; let best=i;
    for(let j=1;j<=n;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); if(c[j]<best)best=c[j]; }
    if(best>2) return 9; p=c; }
  return p[n];
}
function lookupCode(num, letter, roman){
  num = String(parseInt(num,10));
  return byCode[num+(letter||'')+(roman||'')] || byCode[num+(letter||'')] || byCode[num] || null;
}
function analyze(text){
  let t = ' ' + text + ' ';
  t = t.replace(/-\s*\n\s*/g,'').replace(/\n/g,' ');
  t = t.replace(/\d+(\.\d+)?\s*%/g,' ');                                 // 去掉百分比
  t = t.replace(/(\d{3,4}[a-fA-F]?)\s*\(\s*(i{1,3}|iv|vi?)\s*\)/gi,'$1$2'); // 500(ii) → 500ii
  t = t.replace(/\b(e|ins)\s*-?\s*(?=\d{3,4})/gi,' ');                    // E471 / INS 471
  const parts = t.split(/[,;:()\[\]{}.•·\/]+|\s-\s/);
  const out = [], seen = new Set();
  const push = (key, item) => { if(seen.has(key)) return; seen.add(key); out.push(item); };
  for(let raw of parts){
    const orig = raw.trim(); if(!orig) continue;
    let s = norm(orig);
    // 1) 编号
    const codeRe = /\b(\d{3,4})([a-f])?(iii|ii|iv|vi|v|i)?\b/g; let m, hadCode=false;
    while((m = codeRe.exec(s))){
      const n = parseInt(m[1],10); if(n<100||n>1599) continue;
      hadCode = true;
      const e = lookupCode(m[1], m[2], m[3]);
      const label = m[1]+(m[2]||'');
      if(e) push('c'+e.code, {...e, src: label});
      else push('c'+label, {code:label, zh:'未收录编号 '+label, type:'', r:-1, note:'数据库里还没有这个编号', src: label, add:true});
    }
    s = s.replace(/\b\d{3,4}[a-f]?(iii|ii|iv|vi|v|i)?\b/g,' ').replace(/\s+/g,' ').trim();
    s = stripLead(s);
    if(!s || /^\d+$/.test(s) || s.length<2) continue;
    if(hadCode && s.split(' ').length<=2 && !byName[s]) continue;   // 如 "Caramel 150d"，以编号为准
    if(hadCode && byName[s] && byName[s].code) continue;
    // 2) 完全匹配
    let e = byName[s] || (s.endsWith('s') && byName[s.slice(0,-1)]) || (s.endsWith('es') && byName[s.slice(0,-2)]);
    if(e){ push(e.code?'c'+e.code:'n'+e.zh, {...e, src: orig}); continue; }
    if(classSet.has(s)) continue;
    // 3) 句中找已知名称（可多个）
    const padded = ' '+s+' '; const used = []; const found = [];
    for(const a of aliasList){
      if(a.length < 3) continue;
      let idx = padded.indexOf(' '+a+' ');
      if(idx<0) continue;
      const st = idx, en = idx + a.length + 1;
      if(used.some(([x,y]) => st < y && en > x)) continue;
      used.push([st,en]); found.push([st, byName[a], a]);
    }
    found.sort((x,y)=>x[0]-y[0]);
    let realFound = false;
    for(const [,fe,a] of found){ if(classSet.has(a)) continue; realFound = true; push(fe.code?'c'+fe.code:'n'+fe.zh, {...fe, src: orig}); }
    if(realFound) continue;
    // 只剩类别词？
    let rest = padded; for(const [st,en] of used) rest = rest.slice(0,st) + ' '.repeat(en-st) + rest.slice(en);
    for(const c of classSet) rest = (' '+rest+' ').replace(' '+c+' ',' ');
    if(!rest.trim() || stripLead(norm(rest))==='' ) continue;
    if(hadCode && rest.trim().split(' ').length<=2) continue;
    // 4) 模糊匹配（OCR 错字）
    if(s.length >= 5){
      let best=null, bd=9; const lim = s.length>=10 ? 2 : 1;
      for(const a of aliasList){ if(Math.abs(a.length-s.length)>lim) continue; const d = lev(s,a); if(d<bd){bd=d;best=a;} }
      if(best && bd<=lim){ const fe = byName[best]; push(fe.code?'c'+fe.code:'n'+fe.zh, {...fe, src: orig, fuzzy:true}); continue; }
    }
    push('u'+s, {code:'', zh:'未识别', type:'', r:-1, note:'', src: orig, add:false});
  }
  return out;
}

// ===== 界面 =====
if(typeof document !== 'undefined'){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let last = [];
  function render(){
    const only = $('onlyAdd').checked;
    const items = only ? last.filter(i => i.add || i.r>=1 || i.r===-1) : last;
    const cnt = {0:0,1:0,2:0,'-1':0}; last.forEach(i => cnt[i.r]++);
    $('sum').innerHTML =
      `<span class="pill"><span class="dot d0"></span>正常 ${cnt[0]}</span>`+
      `<span class="pill"><span class="dot d1"></span>留意 ${cnt[1]}</span>`+
      `<span class="pill"><span class="dot d2"></span>少吃 ${cnt[2]}</span>`+
      (cnt[-1] ? `<span class="pill"><span class="dot du"></span>未识别 ${cnt[-1]}</span>` : '');
    $('list').innerHTML = items.map(i => `
      <li class="r${i.r}">
        <div class="top"><span class="zh">${esc(i.zh)}</span><span class="type">${esc(i.type)}${i.code?' · '+esc(i.code):''}</span></div>
        <div class="en">${esc(i.src)}${i.fuzzy?'（模糊匹配，请核对）':''}</div>
        ${i.note ? `<div class="note">${esc(i.note)}</div>` : ''}
      </li>`).join('');
    $('out').hidden = false;
  }
  function run(){
    const txt = $('txt').value.trim();
    if(!txt){ $('status').textContent = '先粘贴或拍一张成分表。'; return; }
    last = analyze(txt);
    $('status').textContent = `共 ${last.length} 项`;
    render();
  }
  $('go').onclick = run;
  $('onlyAdd').onchange = render;
  $('clear').onclick = () => { $('txt').value=''; $('out').hidden=true; $('status').textContent=''; };
  $('demo').onclick = () => { $('txt').value = 'Ingredients: Wheat Flour (contains Thiamine, Folic Acid), Sugar, Vegetable Oil (Palm, Canola), Glucose Syrup, Cocoa (3%), Salt, Emulsifiers (471, Soy Lecithin), Raising Agents (500ii, 450), Colour (150d), Flavour, Preservative (282), Sweetener (955). Contains: Wheat, Soy.'; run(); };
  $('paste').onclick = async () => {
    try{ const t = await navigator.clipboard.readText(); if(t){ $('txt').value = t; run(); } else $('status').textContent='剪贴板是空的。'; }
    catch(e){ $('status').textContent = '浏览器不允许直接读取剪贴板，请长按文本框手动粘贴。'; }
  };

  // 拍照识别（Tesseract.js，在手机本地运行）
  let worker = null;
  function loadScript(src){ return new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=bad; document.head.appendChild(s); }); }
  function shrink(file){
    return new Promise(res => {
      const img = new Image(); img.onload = () => {
        const max = 2000, k = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement('canvas'); c.width = img.width*k; c.height = img.height*k;
        const g = c.getContext('2d'); g.filter = 'grayscale(1) contrast(1.3)'; g.drawImage(img,0,0,c.width,c.height);
        c.toBlob(b => res(b), 'image/jpeg', 0.92);
      };
      img.src = URL.createObjectURL(file);
    });
  }
  $('cam').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{
      if(!window.Tesseract){ $('status').textContent = '首次使用，正在加载识别程序（约几 MB）…'; await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'); }
      if(!worker){ $('status').textContent = '正在准备英文识别…'; worker = await Tesseract.createWorker('eng'); }
      $('status').textContent = '正在识别文字…';
      const img = await shrink(f);
      const { data } = await worker.recognize(img);
      $('txt').value = data.text.trim();
      run();
      $('status').textContent += '（拍照识别可能有错字，可在上面文本框修改后再点“识别”）';
    }catch(err){ $('status').textContent = '识别失败：' + (err && err.message || err) + '。可以改用 Google Lens 复制文字。'; }
    e.target.value = '';
  };
}
</script>
</body>
